<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171b19">
  <title>Ouisti’Team Companion — Mobile</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Mascotte Ouisti’Team">
      <div class="brand-copy">
        <p class="eyebrow">KING OF THE JUNGLE</p>
        <h1>Ouisti’Team</h1>
        <p class="sub">Le camp de base de la communauté</p>
      </div>
      <span class="brand-mark" aria-hidden="true">♛</span>
    </header>

    <nav class="tabs" aria-label="Rubriques du compagnon">
      <button class="tab active" type="button" data-tab="live">Live</button>
      <button class="tab" type="button" data-tab="planning">Planning</button>
      <button class="tab" type="button" data-tab="decks">Decks</button>
      <button class="tab" type="button" data-tab="tournaments">Tournois</button>
      <button class="tab" type="button" data-tab="kings">Temple</button>
      <button class="tab" type="button" data-tab="community">Infos</button>
    </nav>

    <section id="content" class="content" aria-live="polite" aria-busy="false"></section>
    <footer><span class="leaf">✦</span> Ouisti’Team Companion <span class="dot">•</span> <span id="status">Chargement de la jungle…</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
